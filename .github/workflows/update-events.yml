name: Update events daily

on:
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC = 07:00 Madrid (verano) / 06:00 (invierno)
  workflow_dispatch: # allow manual trigger

permissions:
  contents: write

jobs:
  fetch-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Fetch Ajuntament events
        run: node scripts/fetch-events.mjs

      - name: Fetch CulturaJove events
        run: node scripts/fetch-culturajove.mjs

      - name: Fetch premium venues
        run: node scripts/fetch-premium-venues.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/events.json public/culturajove-events.json public/premium-events.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "data: daily event update $(date -u +%Y-%m-%d)"
          git push
